services:
  banco:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: produtos
    volumes:
      - ./produtos.sql:/docker-entrypoint-initdb.d/produtos.sql
    networks:
     - rede
    restart: unless-stopped

  api:
    build: .
    image: api
    ports:
      - "4040:4040"
    networks:
      - rede
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
 
networks:
    rede:
      driver: bridge
 